<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMC المحاكي السريري | GemIInI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  
  <nav class="navbar">
    <div class="container nav-content">
      <a href="index.html" class="brand-logo"><div class="logo-icon">G</div> أكاديمية جيميناي</a>
      <ul class="nav-links">
        <li><a href="index.html">الرئيسية</a></li>
        <li><a href="registry.html">سجل الخريجين</a></li>
        <li><a href="reviews.html">التدقيق السريري</a></li>
        <li><a href="smc.html" class="active">المحاكي (SMC)</a></li>
      </ul>
    </div>
  </nav>

  <div class="container" style="padding-top: 40px; max-width: 800px;">
    
    <div style="text-align:center; margin-bottom:30px;">
      <h1 style="color: var(--purple-dark);">بنك الأسئلة الموثق (Live Simulator)</h1>
      <p style="color: var(--text-muted); font-size:14px; margin-top:8px;">إجاباتك الصحيحة ستتم إضافتها تلقائياً إلى رصيدك الأكاديمي (GP) عبر الخادم المركزي.</p>
    </div>

    <!-- The Simulator UI -->
    <div id="raw-question-container" class="glass-card">
      <div style="display:flex; justify-content:space-between; margin-bottom: 20px; font-size:12px; font-weight:bold; color:var(--purple-brand);">
        <span id="raw-meta-badge">SMC INDEX: #RAW-01</span>
        <span id="simulator-score-badge" style="color:var(--gold);">الرصيد: 0 GP</span>
      </div>

      <h3 id="raw-case-prompt" style="line-height: 1.8; margin-bottom: 25px; color: var(--purple-dark);">
        جاري تحميل الحالة السريرية...
      </h3>

      <div id="raw-options-grid">
        <!-- Buttons loaded by app.js -->
      </div>

      <div id="raw-mtc-explanation" style="display:none; margin-top:20px; background:var(--purple-light); padding:15px; border-radius:var(--radius-sm); border:1px solid var(--purple-brand);">
        <strong style="color:var(--purple-brand);">الشرح السريري:</strong>
        <p id="raw-mtc-text" style="font-size:13px; margin-top:8px; line-height:1.6;"></p>
      </div>
    </div>

  </div>

  <script src="ga_data.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
